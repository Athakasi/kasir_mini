name: Deploy Web ke GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # agar bisa diklik manual juga dari tab Actions

# Izin resmi yang dibutuhkan GitHub Actions untuk menerbitkan ke GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode repo
        uses: actions/checkout@v4

      - name: Siapkan Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Ambil dependency
        run: flutter pub get

      # PENTING: --base-href wajib sesuai nama repo (/kasir_mini/) agar layar tidak putih kosong!
      - name: Build Flutter Web
        run: flutter build web --release --base-href "/${{ github.event.repository.name }}/"

      - name: Konfigurasi GitHub Pages
        uses: actions/configure-pages@v5

      - name: Kemas folder build/web
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - name: Tayangkan ke GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
