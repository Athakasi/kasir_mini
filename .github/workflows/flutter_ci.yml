name: Flutter CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Ambil dependency
        run: flutter pub get

      - name: Cek kode (analyze)
        run: flutter analyze

      - name: Jalankan tes dasar
        run: flutter test
